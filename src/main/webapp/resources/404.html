<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="/css/error.css">
</head>

<body>
<div class="content-wrapper d-flex align-items-center justify-content-center min-vh-100">

    <!-- Error Content -->
    <div class="container text-center">

        <!-- Error Image -->
        <div class="error-image mb-4">
            <img src="/resources/icons/error404.webp" alt="404 Error Icon"
                 style="max-width: 150px; width: 100%; height: auto;">
        </div>

        <!-- Error Heading -->
        <h1 class="display-4 text-danger">404 - Page Not Found</h1>

        <!-- Error Message -->
        <p class="text-muted mt-3">Sorry, the page you're looking for doesn't exist.</p>

        <!-- Return to Home Button -->
        <div class="mt-4">
            <a href="/api/v1/welcome" class="btn btn-primary">Return to Home Page</a>
        </div>
    </div>
</div>
</body>
</html>
