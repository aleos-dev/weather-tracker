<!DOCTYPE html>
<html lang=en xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">
    <h2>Sign-in</h2>

    <!-- Messages -->
    <div th:replace="~{/fragment/messages :: displayMessage}"></div>
    <div th:replace="~{/fragment/messages :: displayErrorMessage}"></div>

    <!-- Sign-in form -->
    <form th:action="@{/api/v1/sign-in}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p>Don't have an account? <a th:href="@{/api/v1/sign-up}">Sign-up here</a></p>
</div>
</body>
</html>
