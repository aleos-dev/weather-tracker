<!DOCTYPE html>
<html lang=en xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragment/head :: head ('Sign In')}"></head>

<body>
<div class="container">
    <div th:replace="~{/fragment/header :: simple-header}"></div>

    <h2>Sign-in</h2>

    <div th:replace="~{/fragment/messages :: displayMessage}"></div>
    <div th:replace="~{/fragment/messages :: displayErrorMessage}"></div>

    <form th:action="@{/api/v1/sign-in}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p>Don't have an account? <a th:href="@{/api/v1/sign-up}">Sign-up here</a></p>
</div>

<div th:replace="~{/fragment/footer :: footer}"></div>
</body>
</html>
