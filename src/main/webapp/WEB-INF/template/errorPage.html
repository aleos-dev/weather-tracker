<!DOCTYPE html>
<html lang="en">

<head th:replace="~{/fragment/head :: head ('Error Page')}"></head>
<link rel="stylesheet" href="/css/error.css">

<body>

<div class="content-wrapper d-flex flex-column min-vh-100">
    <div th:replace="~{/fragment/header :: simple-header}"></div>

    <div class="container flex-grow-1">

        <h1>Error</h1>

        <div th:replace="~{/fragment/messages :: displayErrorMessage}"></div>
        <p th:if="${message == null}">An unexpected error has occurred.</p>

    </div>
    <div class="welcome-link">
        <a th:href="@{/api/v1/welcome}">Return to Home Pagea </a>
    </div>

    <div th:replace="~{/fragment/footer :: footer}"></div>
</div>
</body>
</html>
